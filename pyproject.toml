[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitivetree-ai"
version = "0.1.0"
description = "Autonomous reasoning framework combining Tree-of-Thoughts search, sandboxed code execution, and critique-driven backtracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
langgraph = ["langgraph>=0.2"]

[project.scripts]
cognitivetree-ui = "cognitivetree.ui.serve:main"
cognitivetree-benchmark = "cognitivetree.benchmark.run:main"

[tool.setuptools.packages.find]
include = ["cognitivetree*"]

# Ships the PEP 561 marker so installers of this package receive its type
# information; without it the annotations stop at the source tree.
[tool.setuptools.package-data]
cognitivetree = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Curated for correctness and modern idiom without stylistic noise:
# pycodestyle/pyflakes baseline, import ordering, bugbear, comprehension and
# pyupgrade modernization, and a conservative slice of flake8-simplify.
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cognitivetree"]

[tool.mypy]
python_version = "3.10"
files = ["cognitivetree"]
# The package ships py.typed, so its annotations are a promise to downstream
# consumers; strict mode is what keeps that promise honest.
strict = true

[[tool.mypy.overrides]]
# langgraph is an optional extra and absent from the type-check environment.
module = ["langgraph.*"]
ignore_missing_imports = true
